name: Validate Tradept

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trade-order-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trade-order-system/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run lint
      - run: python3 -m unittest discover -s server/tests -v
      - run: python3 scripts/version.py
