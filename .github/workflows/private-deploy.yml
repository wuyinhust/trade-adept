name: Private deployment from source
on:
  push:
    branches: [main, 'deploy/**']
    paths:
      - 'README.md'
      - 'docs/**'
      - 'trade-order-system/**'
      - 'local-preview/vendor/**'
      - '.github/workflows/private-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Installer unit tests
        run: python3 -m unittest discover -s trade-order-system/integrations/private-deploy/tests -v
      - name: Free unused SDKs on this disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h / /var/lib/docker
      - name: Prepare disposable enterprise
        run: |
          echo '127.0.0.1 tradept.test' | sudo tee -a /etc/hosts
          sudo python3 trade-order-system/integrations/private-deploy/deploy.py prepare --domain tradept.test --tenant smoke --name 'Installation acceptance' --tls internal
      - name: Build and install the complete stack
        run: sudo python3 trade-order-system/integrations/private-deploy/deploy.py install
      - name: Same-version resume preserves administrator credentials
        run: |
          sudo sha256sum /opt/tradept-private/initial-admin.json > /tmp/admin-before.sha256
          sudo python3 trade-order-system/integrations/private-deploy/deploy.py install
          sudo sha256sum --check /tmp/admin-before.sha256
      - name: Actual HTTPS login, setup, persistence and restore
        run: sudo python3 trade-order-system/integrations/private-deploy/smoke.py /opt/tradept-private
      - name: Redacted initialization diagnostics
        if: failure()
        run: sudo python3 trade-order-system/integrations/private-deploy/diagnostics.py /opt/tradept-private
