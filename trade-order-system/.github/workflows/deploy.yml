name: Validate Tradept

on:
    push:
        branches: [master, main]
    workflow_dispatch:

jobs:
    validate:
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run frontend unit tests
              run: npm test

            - name: Lint runtime modules
              run: npm run lint

            - name: Run local API integration tests
              run: python3 -m unittest discover -s server/tests -v

            - name: Check release metadata
              run: python3 scripts/version.py

            - name: Deployment boundary
              run: echo "Validation only. All current environments are test environments. Updating a hosted test environment requires the authenticated business API and persistent storage; a static-only upload is insufficient."
