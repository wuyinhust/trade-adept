name: Validate Trade Workspace

on:
    push:
        branches: [master, main]
    workflow_dispatch:

jobs:
    validate:
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run frontend unit tests
              run: npm test

            - name: Lint runtime modules
              run: npm run lint

            - name: Run local API integration tests
              run: python3 -m unittest server.tests.test_service -v

            - name: Deployment boundary
              run: echo "Validation only. The workspace now requires its authenticated business API. Configure and approve API hosting before a production release; a static-only upload is insufficient."
