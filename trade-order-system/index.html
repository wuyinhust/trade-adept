<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Tradept" />
        <meta name="theme-color" content="#f5f5f7" />
        <meta name="description" content="Tradept - 通用外贸订单工作区" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.tcloudbase.com https://*.tcloudbasegateway.com https://*.tencentcloudapi.com https://api.exchangerate-api.com https://open.er-api.com wss://*.tcloudbasegateway.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        />
        <link rel="manifest" href="manifest.json" />
        <link rel="icon" type="image/png" sizes="1254x1254" href="assets/brand/tradept-icon.png" />
        <link rel="apple-touch-icon" href="assets/brand/tradept-icon.png" />
        <title>Tradept</title>
        <link rel="stylesheet" href="css/style.css?v=0.1.0" />
        <link rel="stylesheet" href="css/design-v1.css?v=0.1.0" />
        <script src="/vendor/chart.umd.min.js"></script>
        <script src="/vendor/xlsx.full.min.js"></script>
        <!-- CloudBase JS SDK（本地，避免 CDN 加载失败） -->
    </head>
    <body>
        <!-- 数据加载中遮罩 -->
        <div id="loadingOverlay">
            <div class="spinner"></div>
            <p style="font-size: 14px; color: #6e6e73; font-weight: 500">正在加载数据...</p>
        </div>
        <!-- ==================== 登录页 ==================== -->
        <div id="loginPage" class="login-page">
            <div class="login-card">
                <div class="login-header">
                    <h1 class="login-title">
                        <span class="brand-mark brand-mark-login">
                            <span class="brand-logo">
                                <img src="assets/brand/tradept-logo.png" alt="Tradept" width="2065" height="762" />
                            </span>
                        </span>
                    </h1>
                    <p class="login-welcome">Welcome to your workspace</p>
                    <p class="login-subtitle">登录工作区，继续今天的业务。</p>
                </div>
                <form
                    id="loginForm"
                    onsubmit="
                        App.handleLogin(event);
                        return false;
                    "
                >
                    <div class="form-group">
                        <label class="form-label" for="loginUsername">账号</label>
                        <input
                            type="text"
                            class="form-input"
                            id="loginUsername"
                            placeholder="Enter your username"
                            required
                            autocomplete="off"
                        />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="loginPassword">密码</label>
                        <input
                            type="password"
                            class="form-input"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        />
                    </div>
                    <div id="loginError" class="login-error" style="display: none"></div>
                    <button type="submit" class="btn btn-primary login-btn">登录工作区</button>
                </form>
                <div class="login-footer">
                    <img src="assets/team.jpg" alt="团队" class="login-footer-image" />
                    <p class="login-footer-text">Every order. Every detail. Together.</p>
                </div>
            </div>
        </div>

        <!-- ==================== 主应用 ==================== -->
        <div id="app" style="display: none">
            <!-- 侧边栏遮罩（移动端） -->
            <div class="sidebar-overlay" id="sidebarOverlay" onclick="App.toggleMobileSidebar()"></div>
            <!-- 侧边栏 -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="logo">
                        <a class="logo-text brand-mark" href="#/dashboard" aria-label="Tradept 总览">
                            <span class="brand-logo">
                                <img src="assets/brand/tradept-logo.png" alt="Tradept" width="2065" height="762" />
                            </span>
                        </a>
                        <span class="brand-caption">企业工作区</span>
                    </div>
                    <button
                        class="sidebar-toggle"
                        id="sidebarToggle"
                        aria-label="关闭菜单"
                        onclick="App.closeMobileSidebar()"
                    >
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <path
                                d="M2 4.5h14M2 9h14M2 13.5h14"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                            />
                        </svg>
                    </button>
                </div>
                <nav class="sidebar-nav" id="sidebarNav">
                    <p class="sidebar-nav-label">工作区</p>
                    <a href="#/dashboard" class="nav-item" data-page="dashboard" id="nav-dashboard">
                        <span class="nav-icon" data-icon="overview"></span>
                        <span class="nav-label">总览</span>
                    </a>
                    <a href="#/orders" class="nav-item" data-page="orders" id="nav-orders">
                        <span class="nav-icon" data-icon="orders"></span>
                        <span class="nav-label">订单管理</span>
                    </a>
                    <a href="#/customers" class="nav-item" data-page="customers" id="nav-customers">
                        <span class="nav-icon" data-icon="customers"></span>
                        <span class="nav-label">客户管理</span>
                    </a>
                    <a href="#/factories" class="nav-item" data-page="factories" id="nav-factories">
                        <span class="nav-icon" data-icon="factory"></span>
                        <span class="nav-label">工厂管理</span>
                    </a>
                    <a href="#/profit" class="nav-item" data-page="profit" id="nav-profit">
                        <span class="nav-icon" data-icon="chart"></span>
                        <span class="nav-label">利润分析</span>
                    </a>
                    <a href="#/shipping" class="nav-item" data-page="shipping" id="nav-shipping">
                        <span class="nav-icon" data-icon="shipping"></span>
                        <span class="nav-label">物流单证</span>
                    </a>
                    <a href="#/settings" class="nav-item" data-page="settings" id="nav-settings">
                        <span class="nav-icon" data-icon="settings"></span>
                        <span class="nav-label">系统设置</span>
                    </a>
                </nav>
                <div class="sidebar-footer">
                    <div class="sidebar-theme-toggle">
                        <button
                            id="themeToggleBtn"
                            onclick="App.toggleTheme()"
                            title="切换主题"
                            aria-label="切换浅色/暗色主题"
                        >
                            <span id="themeToggleIcon">🌙</span>
                            <span id="themeToggleLabel">暗色模式</span>
                        </button>
                    </div>
                    <div
                        class="cloud-status"
                        id="cloudStatusBar"
                        onclick="App.refreshCloud()"
                        title="Tap to refresh cloud data"
                    >
                        <span id="cloudStatusIcon"></span>
                        <span id="cloudStatusText">Cloud</span>
                        <span id="saveStatusText" role="status" aria-live="polite"></span>
                    </div>
                    <div
                        class="exchange-rate-info"
                        id="sidebarRateInfo"
                        title="Exchange Rate"
                        onclick="window.location.hash = '#/settings'"
                        style="cursor: pointer"
                    >
                        <div class="rate-label">USD / CNY</div>
                        <div class="rate-value" id="exchangeRateDisplay">7.25</div>
                        <div class="rate-source" id="rateSourceText"></div>
                    </div>
                </div>
            </aside>

            <!-- 主内容区 -->
            <main class="main-content">
                <header class="topbar">
                    <div class="topbar-left">
                        <button
                            class="mobile-menu-btn"
                            id="mobileMenuBtn"
                            aria-label="菜单"
                            onclick="App.toggleMobileSidebar()"
                        >
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path
                                    d="M2 5h16M2 10h16M2 15h16"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                />
                            </svg>
                        </button>
                        <h1 class="page-title" id="pageTitle">总览</h1>
                        <div class="company-selector">
                            <select
                                id="companySelect"
                                class="company-select"
                                onchange="App.selectCompany(this.value)"
                            ></select>
                        </div>
                    </div>
                    <div class="topbar-right">
                        <div class="search-box">
                            <input
                                type="text"
                                id="globalSearch"
                                placeholder="搜索订单号、客户名..."
                                class="search-input"
                            />
                            <span class="search-icon">🔍</span>
                        </div>
                        <div class="user-info" id="userInfoDropdown" onclick="App.toggleUserMenu()">
                            <div class="user-avatar" id="userAvatar">A</div>
                            <span class="user-name" id="userNameDisplay">管理员</span>
                            <span class="user-role-badge" id="userRoleBadge">管理员</span>
                            <span class="dropdown-arrow">▼</span>
                            <div class="user-dropdown" id="userDropdown" style="display: none">
                                <div class="dropdown-item user-detail">
                                    <span id="dropdownName"></span>
                                    <span class="text-xs text-gray" id="dropdownRole"></span>
                                </div>
                                <div class="dropdown-divider"></div>
                                <button
                                    type="button"
                                    class="dropdown-item logout-item"
                                    onclick="
                                        event.stopPropagation();
                                        App.handleLogout();
                                    "
                                >
                                    🚪 退出登录
                                </button>
                            </div>
                        </div>
                    </div>
                </header>
                <div class="page-content" id="pageContent">
                    <!-- 页面内容动态渲染 -->
                </div>
            </main>
        </div>

        <!-- 模态框容器 -->
        <div id="modalContainer"></div>

        <!-- Toast 通知容器 -->
        <div id="toastContainer" class="toast-container"></div>

        <!-- Import Map: 强制所有模块加载最新版本（防止浏览器缓存旧代码） -->
        <script type="importmap">
            {
                "imports": {
                    "./js/app.js": "./js/app.js?v=0.1.0",
                    "./js/data.js": "./js/data.js?v=0.1.0",
                    "./js/exchange.js": "./js/exchange.js?v=0.1.0",
                    "./js/profit.js": "./js/profit.js?v=0.1.0",
                    "./js/dashboard.js": "./js/dashboard.js?v=0.1.0",
                    "./js/orders.js": "./js/orders.js?v=0.1.0",
                    "./js/settings.js": "./js/settings.js?v=0.1.0",
                    "./js/auth.js": "./js/auth.js?v=0.1.0",
                    "./js/utils.js": "./js/utils.js?v=0.1.0",
                    "./js/constants.js": "./js/constants.js?v=0.1.0",
                    "./js/cloud.js": "./js/cloud.js?v=0.1.0",
                    "./js/factories.js": "./js/factories.js?v=0.1.0",
                    "./js/order-import.js": "./js/order-import.js?v=0.1.0",
                    "./js/ui.js": "./js/ui.js?v=0.1.0",
                    "./js/customers.js": "./js/customers.js?v=0.1.0",
                    "./js/shipping.js": "./js/shipping.js?v=0.1.0"
                }
            }
        </script>

        <!-- ES Modules 入口 (v41 动态 import 懒加载) -->
        <script type="module" src="js/backend-bootstrap.js?v=0.1.0"></script>
    </body>
</html>
