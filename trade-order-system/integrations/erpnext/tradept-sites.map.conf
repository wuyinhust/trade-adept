# Fixed local console hosts and the gateway's fixed site headers only.
# The frontend template rejects the invalid sentinel before serving assets.
map "$http_host|$http_x_frappe_site_name" $tradept_site_name {
    default __tradept_invalid_site__;
    "127.0.0.1:3088|" frontend;
    "localhost:3088|" frontend;
    "127.0.0.1:3088|frontend" frontend;
    "localhost:3088|frontend" frontend;
    "127.0.0.1:3088|grandware.test" grandware.test;
    "localhost:3088|grandware.test" grandware.test;
    "grandware.localhost:3088|" grandware.test;
    "grandware.localhost:3088|grandware.test" grandware.test;
}
