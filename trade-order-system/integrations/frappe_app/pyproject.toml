[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradept_core"
version = "0.2.0"
description = "Tradept foreign-trade workspace on the ERPNext authoritative database"
requires-python = ">=3.11"
authors = [{name = "Tradept"}]

[tool.setuptools.packages.find]
where = ["."]
include = ["tradept_core*"]

[tool.setuptools.package-data]
tradept_core = ["modules.txt"]
